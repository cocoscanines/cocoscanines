<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  {{- partial "head.html" . -}}
  {{- if .HasShortcode "gallery-grid" }}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox@3/dist/css/glightbox.min.css">
  {{- end }}
</head>
<body>
  {{- partial "header.html" . -}}
  <main>
    {{- block "main" . }}{{ end -}}
  </main>
  {{- partial "footer.html" . -}}
  {{- if .HasShortcode "gallery-grid" }}
  <script src="https://cdn.jsdelivr.net/npm/glightbox@3/dist/js/glightbox.min.js"></script>
  <script>GLightbox({ selector: '.glightbox' });</script>
  {{- end }}
  {{- if .HasShortcode "tally-embed" }}
  <script src="https://tally.so/widgets/embed.js" async></script>
  {{- end }}
</body>
</html>
