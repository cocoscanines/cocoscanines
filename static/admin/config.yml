backend:
  name: github
  repo: cocoscanines/cocoscanines
  branch: main
  base_url: "https://gh-oauth-proxy.ron-250.workers.dev"
  app_id: "Ov23li4N36XuKCkM1a75"

media_folder: "static/images/uploads"
# Apex-domain default; index.html overrides it at runtime with the value that
# matches the actual deploy path prefix, so nothing here is environment-specific.
public_folder: "/images/uploads"

# Client-side processing of uploaded images (Decap >= 3.16): resize, convert
# to JPEG, and strip EXIF/GPS metadata before committing to the repo.
media_processing:
  enabled: true
  format:
    enabled: true
    default: jpeg
  quality: 78
  width: 1600
  strip_metadata: true

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "content/_index.md"
        name: "home"
        label: "Home Page"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Hero Headline", name: "hero_headline", widget: "string"}
          - {label: "Hero Subtext", name: "hero_subtext", widget: "text"}
          - {label: "Hero Image", name: "hero_image", widget: "image"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Social Preview Image", name: "social_image", widget: "image", required: false, hint: "Landscape ~1200×630. Leave empty to use the site default."}
      - file: "content/services.md"
        name: "services"
        label: "Services"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Social Preview Image", name: "social_image", widget: "image", required: false, hint: "Landscape ~1200×630. Leave empty to use the site default."}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "content/about.md"
        name: "about"
        label: "About"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Social Preview Image", name: "social_image", widget: "image", required: false, hint: "Landscape ~1200×630. Leave empty to use the site default."}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "content/gallery.md"
        name: "gallery"
        label: "Gallery"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Social Preview Image", name: "social_image", widget: "image", required: false, hint: "Landscape ~1200×630. Leave empty to use the site default."}
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Alt text", name: "alt", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "content/contact.md"
        name: "contact"
        label: "Contact"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Social Preview Image", name: "social_image", widget: "image", required: false, hint: "Landscape ~1200×630. Leave empty to use the site default."}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "content/book.md"
        name: "book"
        label: "Book (Scheduling)"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Social Preview Image", name: "social_image", widget: "image", required: false, hint: "Landscape ~1200×630. Leave empty to use the site default."}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "content/boarding.md"
        name: "boarding"
        label: "Boarding Requests"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Social Preview Image", name: "social_image", widget: "image", required: false, hint: "Landscape ~1200×630. Leave empty to use the site default."}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "content/new-pup.md"
        name: "new-pup"
        label: "New Pup Form"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Social Preview Image", name: "social_image", widget: "image", required: false, hint: "Landscape ~1200×630. Leave empty to use the site default."}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "content/waiver.md"
        name: "waiver"
        label: "Liability Waiver"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Social Preview Image", name: "social_image", widget: "image", required: false, hint: "Landscape ~1200×630. Leave empty to use the site default."}
          - {label: "Body", name: "body", widget: "markdown"}
  - name: "site_data"
    label: "Site Settings"
    files:
      - file: "data/site.yaml"
        name: "site"
        label: "Business Info"
        format: "yaml"
        fields:
          - {label: "Phone", name: "phone", widget: "string", required: false}
          - {label: "Address", name: "address", widget: "string"}
          - {label: "Daycare Hours", name: "daycare_hours", widget: "string"}
          - {label: "Boarding Hours", name: "boarding_hours", widget: "string"}
          - label: "Social Links"
            name: "socials"
            widget: "list"
            summary: "{{fields.network}}"
            fields:
              - label: "Network"
                name: "network"
                widget: "select"
                options: ["instagram", "facebook", "threads", "nextdoor", "yelp", "google"]
              - label: "Profile URL"
                name: "url"
                widget: "string"
