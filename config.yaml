# Deploy URL policy: no domain or path prefix is ever committed here.
# CI injects the real base URL at build time (.github/workflows/deploy.yml):
# during preview it derives the GitHub Pages project URL from the run context;
# at go-live, set the SITE_URL repository variable to the apex domain.
# "/" keeps plain local `hugo` / `hugo server` builds working.
baseURL: /
locale: en-us
title: "Coco's Canines"
pygmentsUseClasses: false

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: "Home-based doggie daycare, boarding & walking in Arlington & Marysville, WA. Over 10 years of loving care."
